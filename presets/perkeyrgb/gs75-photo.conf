# 1. base fill
all steady 4a5cff
# 2. groups: arrows / nav (Ins,PgUp,Del,PgDn) / numpad_ops (NumLock,/,*,-,+)
arrows steady ff2a2a
118,112,119,117 steady ff2a2a
77,106,63,82,86 steady ff2a2a
# 3. per-key overrides: Esc, Tab, Fn, Super
9 steady ff2a2a
23 steady ff2a2a
fn steady ff2a2a
133 steady ff2a2a
